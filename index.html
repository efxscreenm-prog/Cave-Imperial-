const D={"guide":["Gestion de stock de cave Imperiale — Mode d'emploi","COMPOSITION DU CLASSEUR","• Tableau de bord : indicateurs clés, graphiques, récapitulatif de la dernière clôture et","  inventaire journalier par article — tout est automatique.","• Articles : fiche de référence des 143 produits (code, catégorie, prix, stock, alertes).","• Entrées : journal des entrées de stock (achats, réapprovisionnements).","• Sorties : journal des sorties de stock (ventes en gros ou au détail, avaries).","• Caisse : dettes clients (crédit), reliquats à récupérer et sorties d'espèces.","• Clôtures Journalières : un journal, une ligne par jour, avec cumul progressif du CA.","COMMENT UTILISER LE CLASSEUR","1. Feuille Articles : renseignez le Prix de gros, le Prix de détail, le Stock initial et le","   Seuil d'alerte de chaque article (cellules jaunes). Les autres colonnes se calculent seules.","2. Pour une entrée ou une sortie : allez sur la feuille correspondante, choisissez la Date,","   puis sélectionnez le nom du produit dans la liste déroulante de la colonne « Désignation »","   (produits triés par ordre alphabétique). Le Code et la Catégorie se remplissent seuls.","3. Choisissez le Type (Gros ou Détail) : le prix unitaire et le montant se calculent seuls.","4. Le stock (feuille Articles, colonne Stock Actuel) se met à jour automatiquement dès","   qu'une entrée ou une sortie est enregistrée, que ce soit une vente en gros, au détail,","   ou une avarie — aucune action manuelle n'est nécessaire.","5. En haut à droite des feuilles Entrées et Sorties : un petit encadré « Totaux du jour »","   récapitule automatiquement les quantités/montants du jour, directement sur la feuille.","CONVERSION AUTOMATIQUE DÉTAIL → GROS (CARTONS/PALETTES)","• Sur les feuilles Entrées et Sorties, dès qu'une ligne en Détail atteint 24 unités pour une","  Bière, ou 6 unités pour les autres catégories, la colonne « Équiv. Gros » ajoute","  automatiquement le nombre de cartons/palettes correspondant (ex : 30 bières au détail = 1","  carton + 6 restantes). Ces seuils sont modifiables en haut de la feuille Tableau de bord.","• Sur la feuille Articles, les colonnes « Entrées/Sorties Gros équiv. » additionnent ces cartons","  convertis aux mouvements déjà enregistrés directement en Gros.","SORTIES : VENTES, AVARIES, CRÉDITS ET RELIQUATS","• Motif « Vente » : sortie normale, facturée au client (choisir Gros ou Détail).","• Motif « Avarie » : produit cassé, périmé ou perdu — le prix passe à 0 F CFA automatiquement","  (aucune recette), mais la quantité est bien déduite du stock.","• Statut Paiement : « Payé » si le client règle immédiatement, « Crédit » si le produit sort","  sans être payé (indiquez alors le nom du client dans « Client / Débiteur »), « N/A » pour","  les avaries. Les ventes à Crédit apparaissent automatiquement dans Caisse > Dettes clients.","• Colonne « Reliquat à récupérer » : montant qu'un client doit venir récupérer (ex. monnaie non","  rendue). Indiquez le montant, puis le Statut « Récupéré » ou « Non récupéré ». Même principe","  sur la feuille Entrées (colonnes Fournisseur/Bénéficiaire puis Reliquat). Ces lignes","  apparaissent automatiquement dans Caisse > Reliquats à récupérer.","• La colonne Observations reste libre pour toute remarque (raison de l'avarie, précisions...).","FEUILLE CAISSE (3 blocs)","• Dettes clients : lignes « Crédit » de la feuille Sorties, reprises automatiquement. Saisissez","  le Montant Payé et la Date de Paiement (cellules jaunes) : le Reste à Payer et le Statut se","  recalculent seuls.","• Reliquats à récupérer : reprend automatiquement les lignes « Reliquat » des feuilles Entrées","  et Sorties — rien à saisir ici, le Statut se modifie directement sur la feuille d'origine.","• Sorties de caisse (espèces) : à remplir manuellement à chaque retrait d'argent liquide","  (Date, Bénéficiaire, Montant, Motif) — utile pour suivre les « dettes entreprise ».","• Les totaux en haut de la feuille (dettes en cours, reliquats non récupérés, espèces sorties...)","  sont automatiques.","CLÔTURER UNE JOURNÉE ET SUIVRE LE CHIFFRE D'AFFAIRES CUMULÉ","• Directement sur la feuille Sorties : la Date se remplit désormais toute seule. Ne saisissez","  la date qu'une fois, sur la toute première ligne ; chaque ligne suivante reprend","  automatiquement la même date, jusqu'à ce que vous passiez la colonne « Statut Jour » de la","  DERNIÈRE ligne d'une journée à « Clôturée ». Sur cette ligne-là, les colonnes de droite","  (Quantité/CA/Dettes/Reliquats/Avaries du Jour + CA Cumulé depuis le début) se calculent","  automatiquement, et la ligne suivante reçoit directement la date du jour suivant.","• Vous pouvez toujours utiliser en complément la feuille Clôtures Journalières (une ligne par","  jour, plus lisible pour l'historique complet) : elle reste disponible et indépendante.","• Un fichier Excel classique ne peut pas se « fermer » tout seul en fin de journée (cela demande","  une macro) : la feuille Clôtures Journalières reproduit ce geste simplement — vous ajoutez la","  date du jour dans la première ligne libre, et tout se calcule automatiquement en face :","  quantités entrées/sorties, chiffre d'affaires du jour ET cumulé depuis la toute première","  date enregistrée, nouvelles dettes et reliquats du jour (+ leurs cumuls), sorties d'espèces","  du jour, avaries du jour.","• Passez la colonne Statut à « Clôturée » une fois la journée vérifiée (facultatif, juste pour","  votre suivi — le calcul se fait dès que la date est saisie, que le statut soit rempli ou non).","• Le Tableau de bord affiche un « Récapitulatif de la dernière journée enregistrée » qui reprend","  automatiquement la dernière ligne de cette feuille — un résumé de toutes les autres feuilles","  en un coup d'œil dès qu'une journée est ajoutée.","• Le Tableau de bord affiche aussi un « Inventaire journalier par article » : entrez n'importe","  quelle date dans la cellule prévue pour voir, pour chaque article, les quantités entrées et", const GUIDE=[['Principes généraux',['<b>Cellules jaunes</b> : à saisir par vous. Cellules blanches : calculées automatiquement, tout se met à jour dès qu’une valeur change.','Chaque tableau a une <b>recherche</b>, des <b>filtres</b> et un tri (clic sur un titre de colonne). « + Ajouter une ligne » crée une ligne, ✕ la supprime.','<b>Enregistrer</b> (en haut) télécharge une nouvelle copie du fichier contenant toutes vos données : remplacez l’ancien fichier par celle-ci. Entre-temps, vos saisies sont aussi gardées dans le navigateur de cet ordinateur.','<b>Réinitialiser</b> efface vos modifications et revient aux données d’origine (les mots de passe sont conservés ; celui du Tableau de bord est demandé). <b>Thème</b> : clair ou sombre.']],

['Articles 🔒',['Cellules jaunes : code, catégorie, unité, prix de gros (par carton), prix d’entrée (prix d’achat), prix de détail, stock initial, seuil carton et seuil d’alerte.','Le stock actuel, la valeur du stock, la marge unitaire et le statut se calculent seuls. Une ligne rouge signale un article sous son seuil d’alerte.','La liste est classée par ordre alphabétique. « + Ajouter une ligne » demande le nom du nouvel article : il prend sa place alphabétique, avec un code provisoire (NEW…) à modifier. Gardez des codes uniques.','Le bouton ✕ supprime un article enregistré après confirmation : si des entrées ou sorties portent son nom, elles restent dans les journaux mais ne comptent plus dans un stock.']],
['Entrées et Sorties',['Saisissez la date, puis la désignation (choisissez dans les suggestions) : le code et la catégorie se remplissent seuls. Une nouvelle ligne reprend la date de la ligne précédente.','Choisissez le Type (Gros ou Détail) : prix unitaire, montant et quantité en unités se calculent seuls. Le détail est converti en équivalent gros d’après le « Seuil carton » de l’article.','Le stock de la page Articles suit automatiquement chaque entrée, vente ou avarie.','<b>Sorties</b> : motif « Vente » (facturée) ou « Avarie » (prix 0 F, mais quantité déduite du stock). Paiement : « Payé », « Crédit » (indiquez le client) ou « N/A ». Reliquat : montant à récupérer, puis statut Récupéré / Non récupéré (idem sur Entrées, avec le fournisseur).']],
['Commande (factures)',['« + Nouvelle facture » : le numéro (IMP-0001, IMP-0002…) est attribué automatiquement ; la date et l’heure sont celles de la validation.','Saisissez client et caissier, puis pour chaque ligne le <b>code article</b>, le type (Gros/Détail) et la quantité : la référence, le prix unitaire et le montant se remplissent seuls, et le total s’affiche en bas. Indiquez Payé comptant / Non payé et Livré / Non livré.','« Valider la facture » l’enregistre dans l’une des 4 catégories : payées et livrées, payées et non livrées, livrées à crédit, non payées et non livrées. Cliquez sur un numéro pour la revoir, la télécharger en <b>JPG</b> ou <b>PDF</b>, ou la marquer payée / livrée (elle change alors de catégorie).','Les prix d’une facture validée sont figés. Les numéros ne sont jamais réutilisés. Les factures ne modifient pas le stock : enregistrez les sorties correspondantes dans Sorties.']],
['Caisse',['Dettes clients : les ventes à crédit de Sorties sont reprises automatiquement ; saisissez seulement le montant payé et la date de paiement.','Reliquats : repris des pages Entrées et Sorties (le statut se change à la source). Sorties de caisse : espèces retirées, à saisir à chaque retrait (date, bénéficiaire, montant, motif).']],
['Clôtures journalières 🔒 et Tableau de bord 🔒',['Clôtures : ajoutez une ligne par journée (la date suivante est proposée). Quantités, chiffre d’affaires du jour et cumulé, dettes, reliquats, espèces et avaries se calculent seuls. Le statut Ouverte / Clôturée est facultatif.','Tableau de bord : indicateurs, synthèse par catégorie, CA par journée, récapitulatif de la dernière journée enregistrée et inventaire par article à la date de votre choix.']],

function pdfOf(jpg,w,h){const enc=s=>new TextEncoder().encode(s),parts=[],offs=[];let len=0;const push=b=>{parts.push(b);len+=b.length};

 offs[5]=len;push(enc(`5 0 obj\n<</Type/XObject/Subtype/Image/Width ${w}/Height ${h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jpg.length}>>\nstream\n`));push(jpg);push(enc('\nendstream\nendobj\n'));
